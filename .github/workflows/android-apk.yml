
name: Build Photography Tycoon APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract game
        run: |
          unzip Photography_Business_Tycoon_Android_Project.zip -d extracted

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix Vite build path
        working-directory: extracted/Photography_Business_Tycoon_Android
        run: |
          npm pkg set 'scripts.build=vite build www --outDir ../dist'

      - name: Install and build
        working-directory: extracted/Photography_Business_Tycoon_Android
        run: |
          npm install
          npm run build

      - name: Create Android project
        working-directory: extracted/Photography_Business_Tycoon_Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Set landscape
        working-directory: extracted/Photography_Business_Tycoon_Android
        run: |
          sed -i 's/android:name=".MainActivity"/android:screenOrientation="landscape" android:name=".MainActivity"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: extracted/Photography_Business_Tycoon_Android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photography-Tycoon-APK
          path: extracted/Photography_Business_Tycoon_Android/android/app/build/outputs/apk/debug/app-debug.apk
